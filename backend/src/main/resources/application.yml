spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caresync_db}
    username: ${DB_USER:caresync_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.threadCount: 10

caresync:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 86400000
    refresh-token-expiry: 604800000
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: caresync-docs
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS:classpath:firebase-service-account.json}
