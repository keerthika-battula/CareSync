spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caresync_db}
    username: ${DB_USER:caresync_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.threadCount: 10

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

caresync:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 86400000
    refresh-token-expiry: 604800000
  mail:
    from: ${MAIL_FROM:no-reply@caresync.com}
    dev-mode: ${MAIL_DEV_MODE:false}
  auth:
    password-reset:
      cooldown-seconds: ${PASSWORD_RESET_COOLDOWN:60}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: caresync-docs
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS:classpath:firebase-service-account.json}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
