spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caresync_db}
    username: ${DB_USER:caresync_user}
    password: ${DB_PASSWORD}

logging:
  level:
    com.caresync: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
