# ===================================================================
# TEST-ONLY CONFIGURATION
# Used exclusively by automated unit and integration test suites.
# All values below are mock/in-memory dummies and cannot be used
# in production or development environments.
# ===================================================================
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false

caresync:
  jwt:
    # Test-only dummy secret key strictly for testing token verification
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctY2FyZXN5bmM=
    access-token-expiry: 86400000
    refresh-token-expiry: 604800000
  mail:
    from: test@caresync.com
    dev-mode: true
  auth:
    password-reset:
      cooldown-seconds: 0
  minio:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket-name: caresync-docs-test
