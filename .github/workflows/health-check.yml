name: CareSync Health Check & Keep-Alive

on:
  schedule:
    # Run every 10 minutes to keep Render free-tier instances warm
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'

jobs:
  health-check:
    name: Verify Backend & Frontend Health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ping Services & Keep Warm
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL || 'https://caresync-4dfr.onrender.com' }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || vars.FRONTEND_URL || 'https://caresync-web-rav8.onrender.com' }}
        run: |
          set -e

          # Resolve target health endpoint URLs
          BASE_BACKEND="${BACKEND_URL%/}"
          if [[ "$BASE_BACKEND" == *"/health"* ]] || [[ "$BASE_BACKEND" == *"/actuator"* ]]; then
            TARGET_BACKEND="$BASE_BACKEND"
          else
            TARGET_BACKEND="$BASE_BACKEND/api/v1/health"
          fi
          TARGET_FRONTEND="${FRONTEND_URL%/}"

          echo "=========================================="
          echo "CareSync Live Health Check"
          echo "Target Backend:  $TARGET_BACKEND"
          echo "Target Frontend: $TARGET_FRONTEND"
          echo "=========================================="

          # Summary report header
          echo "### 🏥 CareSync Live Service Health Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Target URL | Status | Response Time | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

          # Function to probe endpoint with retry and cold-start tolerance
          probe_endpoint() {
            local NAME="$1"
            local URL="$2"
            local MAX_ATTEMPTS=3
            local TIMEOUT=90 # Render free-tier cold starts may take 45-60s
            local SUCCESS=0

            echo ""
            echo "--- Checking $NAME ($URL) ---"

            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              echo "Attempt $attempt of $MAX_ATTEMPTS..."
              
              HTTP_RESPONSE=$(curl --silent --show-error \
                --write-out "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" \
                --max-time "$TIMEOUT" \
                --header "Accept: application/json, text/html, */*" \
                --header "User-Agent: CareSync-HealthCheck/2.0 (GitHubActions)" \
                "$URL" || echo -e "\nHTTP_STATUS:000\nTIME_TOTAL:0.00s")

              BODY=$(echo "$HTTP_RESPONSE" | sed -e '/HTTP_STATUS:/,$d')
              STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\r' | sed -n -e 's/^HTTP_STATUS://p')
              TIME=$(echo "$HTTP_RESPONSE" | tr -d '\r' | sed -n -e 's/^TIME_TOTAL://p')

              echo "Response Code: $STATUS | Time: $TIME"

              if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
                echo "✓ $NAME is UP and Healthy! ($STATUS in $TIME)"
                echo "| **$NAME** | \`$URL\` | $STATUS | $TIME | ✅ UP |" >> "$GITHUB_STEP_SUMMARY"
                return 0
              else
                echo "⚠ Attempt $attempt failed with status $STATUS (Instance might be waking up). Waiting 8s..."
                sleep 8
              fi
            done

            echo "::error::$NAME failed after $MAX_ATTEMPTS attempts (Last status: $STATUS)"
            echo "| **$NAME** | \`$URL\` | Failed ($STATUS) | - | ❌ DOWN |" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          # Probe backend and frontend
          BACKEND_OK=0
          FRONTEND_OK=0

          probe_endpoint "Backend API" "$TARGET_BACKEND" && BACKEND_OK=1 || BACKEND_OK=0
          probe_endpoint "Frontend PWA" "$TARGET_FRONTEND" && FRONTEND_OK=1 || FRONTEND_OK=0

          # Exit with failure if backend service is down
          if [ "$BACKEND_OK" -ne 1 ]; then
            echo "::error::Backend API health check failed"
            exit 1
          fi

          if [ "$FRONTEND_OK" -ne 1 ]; then
            echo "::warning::Frontend PWA ping failed"
          fi

          echo ""
          echo "All checks completed successfully."
