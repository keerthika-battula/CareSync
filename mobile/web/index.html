<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CareSync — Smart Medicine & Healthcare Reminder Platform. Your Care. In Sync. On Time.">

  <!-- Cache-Control to prevent stale index.html in PWA / browsers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CareSync">
  <meta name="theme-color" content="#4A6CF7">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CareSync - Healthcare Platform</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Automatic version upgrade and stale cache flush
    (function() {
      var CURRENT_VERSION = '20260911_09';
      var lastVer = localStorage.getItem('caresync_app_ver');
      
      function flushCacheAndReload() {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
              window.location.reload(true);
            });
          }).catch(function() {
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }

      if (lastVer !== CURRENT_VERSION) {
        localStorage.setItem('caresync_app_ver', CURRENT_VERSION);
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              caches.delete(name);
            });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.update(); });
          });
        }
      }

      // Check version.json dynamically on every load
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function(response) { return response.json(); })
        .then(function(data) {
          if (data && data.buildNumber && data.buildNumber !== CURRENT_VERSION) {
            console.log('[CareSync] New version detected:', data.buildNumber);
            if (!sessionStorage.getItem('caresync_version_reloaded')) {
              sessionStorage.setItem('caresync_version_reloaded', 'true');
              flushCacheAndReload();
            }
          } else {
            sessionStorage.removeItem('caresync_version_reloaded');
          }
        })
        .catch(function(err) {
          // Offline or network error; ignore
        });
    })();

    // CareSync PWA Installation Bridge
    window.caresyncPwaPrompt = null;
    window.caresyncIsInstalled = false;

    // Detect standalone mode
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
      window.caresyncIsInstalled = true;
    }
    if (window.navigator && window.navigator.standalone === true) {
      window.caresyncIsInstalled = true;
    }

    // Listen for beforeinstallprompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.caresyncPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('caresync_pwa_installable'));
    });

    // Listen for appinstalled
    window.addEventListener('appinstalled', function(e) {
      window.caresyncPwaPrompt = null;
      window.caresyncIsInstalled = true;
      window.dispatchEvent(new CustomEvent('caresync_pwa_installed'));
    });

    // Prompt install method
    window.caresyncPromptInstall = function() {
      return new Promise(function(resolve) {
        if (!window.caresyncPwaPrompt) {
          var res = { supported: false, accepted: false };
          window.dispatchEvent(new CustomEvent('caresync_pwa_install_response', { detail: JSON.stringify(res) }));
          resolve(res);
          return;
        }
        var promptEvent = window.caresyncPwaPrompt;
        promptEvent.prompt();
        promptEvent.userChoice.then(function(choiceResult) {
          window.caresyncPwaPrompt = null;
          var accepted = !!(choiceResult && choiceResult.outcome === 'accepted');
          if (accepted) {
            window.caresyncIsInstalled = true;
          }
          var res = { supported: true, accepted: accepted };
          window.dispatchEvent(new CustomEvent('caresync_pwa_install_response', { detail: JSON.stringify(res) }));
          resolve(res);
        }).catch(function(err) {
          var res = { supported: false, accepted: false };
          window.dispatchEvent(new CustomEvent('caresync_pwa_install_response', { detail: JSON.stringify(res) }));
          resolve(res);
        });
      });
    };

    // Listen for Dart-initiated install request
    window.addEventListener('caresync_request_install', function() {
      window.caresyncPromptInstall();
    });

    // Check PWA state
    window.caresyncCheckPwaState = function() {
      var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                         (window.navigator && window.navigator.standalone === true);
      return {
        isInstalled: isStandalone || !!window.caresyncIsInstalled,
        canInstall: !!window.caresyncPwaPrompt
      };
    };

    // Service Worker update detection and controllerchange reload
    if ('serviceWorker' in navigator) {
      var isRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        console.log('[CareSync] New ServiceWorker active, reloading for clean assets...');
        if (!isRefreshing && !sessionStorage.getItem('caresync_sw_refreshed')) {
          isRefreshing = true;
          sessionStorage.setItem('caresync_sw_refreshed', 'true');
          window.location.reload(true);
        }
      });

      // Periodically check for service worker updates
      navigator.serviceWorker.ready.then(function(registration) {
        registration.update();
        setInterval(function() {
          registration.update();
        }, 60 * 1000);
      });
    }

    // Cache clearing hard refresh helper
    window.caresyncHardRefresh = function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var promises = [];
          for (var i = 0; i < registrations.length; i++) {
            promises.push(registrations[i].unregister());
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                promises.push(caches.delete(names[j]));
              }
              Promise.all(promises).then(function() {
                window.location.reload(true);
              });
            });
          } else {
            Promise.all(promises).then(function() {
              window.location.reload(true);
            });
          }
        });
      } else {
        window.location.reload(true);
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
