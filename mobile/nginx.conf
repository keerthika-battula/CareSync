server {
    listen PORT_PLACEHOLDER;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # 1. Critical dynamic entrypoints & scripts: NEVER cache
    location ~* (main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|service-worker\.js|manifest\.json|version\.json|index\.html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 2. SPA Routing: Fallback all non-file routes to index.html with no-cache headers
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # 3. Static immutable assets (Fonts, Images, Icons, Canvas/Wasm chunks in assets/)
    location ~* \.(?:css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|wasm|bin)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # 4. Health check endpoint
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
