server {
    listen PORT_PLACEHOLDER;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA Routing: Fallback all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching (JS, CSS, fonts, images)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker, bootstrapper, and manifest must always be freshly validated
    location ~* (flutter_service_worker\.js|service-worker\.js|flutter_bootstrap\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Health check endpoint for Render and container orchestrators
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
