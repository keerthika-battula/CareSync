server {
    listen PORT_PLACEHOLDER;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. CRITICAL: Entrypoints, bootstrapper, main.dart.js, version manifest, service workers, and index.html MUST ALWAYS be freshly validated
    location ~* (main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|service-worker\.js|manifest\.json|version\.json|index\.html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 2. SPA Routing: Fallback all non-file routes to index.html with no-cache headers
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # 3. Static assets caching (Fonts, Images, Icons, Audio, Canvas/Wasm chunks in assets/)
    location ~* \.(?:css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|wasm|bin)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 4. Health check endpoint for Render and container orchestrators
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
