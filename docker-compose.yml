version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: caresync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-caresync_db}
      POSTGRES_USER: ${DB_USER:-caresync_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - caresync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caresync_user} -d ${DB_NAME:-caresync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: caresync-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - caresync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: caresync-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - caresync-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend service (uncomment when Dockerfile is ready)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: caresync-backend
  #   restart: unless-stopped
  #   environment:
  #     SPRING_PROFILES_ACTIVE: prod
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: ${DB_NAME:-caresync_db}
  #     DB_USER: ${DB_USER:-caresync_user}
  #     DB_PASSWORD: ${DB_PASSWORD}
  #     MINIO_ENDPOINT: http://minio:9000
  #     MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  #     MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  #     JWT_SECRET: ${JWT_SECRET}
  #   ports:
  #     - "${SERVER_PORT:-8080}:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   networks:
  #     - caresync-network

volumes:
  postgres_data:
    name: caresync_postgres_data
  minio_data:
    name: caresync_minio_data
  redis_data:
    name: caresync_redis_data

networks:
  caresync-network:
    name: caresync-network
    driver: bridge
